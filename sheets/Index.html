<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brik projects</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui;color:#202627;background:#f6f7f4;margin:auto;max-width:820px;padding:24px}header{font-weight:700;color:#215641}section,form{background:white;border:1px solid #ccd4cc;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin-bottom:12px}input,textarea,select{display:block;width:100%;padding:9px;font:inherit;border:1px solid #859188;border-radius:5px}button{background:#215641;color:white;padding:9px 15px;border:0;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}article{border-top:1px solid #ddd;padding:12px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}h3{overflow-wrap:anywhere}
</style></head><body><header>▰ Brik</header><h1>My projects</h1>
<form id="editor"><h2 id="heading">New project</h2><label>Project name<input id="project" required maxlength="120"></label>
<label>Status<select id="status"><option>Planning</option><option>Active</option><option>Completed</option></select></label>
<label>Notes<textarea id="notes" rows="3" maxlength="4000"></textarea></label>
<button id="save">Save project</button> <button type="button" id="cancel" hidden>Cancel edit</button></form>
<p role="status" id="message"></p><section><h2>Project list</h2><button id="reload">Reload list</button><div id="list"></div></section>
<script>
const el = id => document.getElementById(id);
let id, version;
function reset() {
  el('editor').reset(); id = crypto.randomUUID(); version = '';
  el('cancel').hidden = true; el('heading').textContent = 'New project';
}
function busy(value) {
  document.querySelectorAll('button,input,textarea,select').forEach(node => node.disabled = value);
}
function fail(error) { busy(false); el('message').textContent = error.message || 'Request failed. Try again.'; }
function load(message = '') {
  busy(true);
  google.script.run.withFailureHandler(fail).withSuccessHandler(rows => {
    const list = el('list'); list.replaceChildren();
    if (!rows.length) list.textContent = 'No projects yet.';
    for (const row of rows) {
      const item = document.createElement('article');
      for (const [tag, value] of [['h3',row[1]],['strong',row[2]],['p',row[3]]]) {
        const node = document.createElement(tag); node.textContent = value; item.append(node);
      }
      const button = document.createElement('button'); button.textContent = 'Edit';
      button.onclick = () => {
        [id, el('project').value, el('status').value, el('notes').value, version] = row;
        el('cancel').hidden = false; el('heading').textContent = 'Edit project'; el('project').focus();
      };
      item.append(button); list.append(item);
    }
    busy(false); el('message').textContent = message;
  }).listProjects();
}
el('editor').onsubmit = event => {
  event.preventDefault(); busy(true); el('message').textContent = 'Saving…';
  google.script.run.withFailureHandler(fail).withSuccessHandler(() => {
    reset(); el('message').textContent = 'Saved. Refreshing list…'; load('Project saved.');
  }).saveProject({id, version, title:el('project').value, status:el('status').value, notes:el('notes').value});
};
el('cancel').onclick = reset;
el('reload').onclick = () => load();
reset(); load();
</script></body></html>
